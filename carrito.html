<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito - FOURTEEN</title>
    <link rel="stylesheet" href="style_2.css">
    <style>
        /* 1. Capa de la imagen de fondo con blur */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(10px); /* Aquí controlas qué tan borroso se ve */
            transform: scale(1.1); /* Evita bordes blancos por el blur */
            z-index: -2;
        }

        /* 2. Capa oscura semi-transparente para que la ventana resalte más */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* 3. La ventana gris oscuro del carrito */
        .contenedor-carrito { 
            position: relative; /* Para que quede por encima del fondo */
            max-width: 800px; 
            margin: 120px auto 50px auto; 
            padding: 30px; 
            background-color: #2b2b2b; /* Color gris oscuro de tu página */
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            color: #ffffff; /* Texto blanco por defecto */
        }

        /* Textos y botones dentro de la ventana */
        .contenedor-carrito h2 {
            margin-bottom: 20px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-volver { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #cccccc; 
            font-weight: bold; 
            transition: color 0.2s;
        }
        .btn-volver:hover { color: #ffffff; }

        .item-carrito { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 15px 0; 
            border-bottom: 1px solid #444; /* Línea separadora sutil */
        }
        
        .item-carrito h3 { 
            font-size: 18px; 
            color: #ffffff; 
            margin: 0;
        }
        
        .item-carrito .precio { 
            font-weight: bold; 
            color: #4ade80; /* El verde vibrante de tus precios */
            font-size: 18px;
        }

        .btn-vaciar { 
            background-color: transparent; 
            color: #e63946; /* Rojo */
            border: 1px solid #e63946; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 25px; 
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-vaciar:hover {
            background-color: #e63946;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="barra-navegacion">
        <h1 style="color:white; margin-left: 40px; font-size: 24px; letter-spacing: 2px;">FOURTEEN</h1>
    </nav>

    <!-- Ventana del Carrito -->
    <div class="contenedor-carrito">
        <a href="index_2.html" class="btn-volver">← Seguir comprando</a>
        <h2>Tu Carrito</h2>
        
        <div id="lista-carrito">
            <!-- Los productos aparecerán aquí -->
        </div>

        <button id="btn-vaciar" class="btn-vaciar">Vaciar Carrito</button>
    </div>

    <script>
        // Lógica de JavaScript para leer la memoria
        let carrito = JSON.parse(localStorage.getItem('carritoFourteen')) || [];
        const contenedorLista = document.getElementById('lista-carrito');
        const btnVaciar = document.getElementById('btn-vaciar');

        function renderizarCarrito() {
            contenedorLista.innerHTML = ''; 

            if (carrito.length === 0) {
                contenedorLista.innerHTML = '<p style="padding: 20px 0; color: #aaa;">Tu carrito está vacío.</p>';
                btnVaciar.style.display = 'none'; // Oculta el botón si no hay nada que vaciar
                return;
            }

            btnVaciar.style.display = 'inline-block';

            carrito.forEach((producto) => {
                contenedorLista.innerHTML += `
                    <div class="item-carrito">
                        <h3>${producto.nombre}</h3>
                        <span class="precio">${producto.precio}</span>
                    </div>
                `;
            });
        }

        btnVaciar.addEventListener('click', () => {
            if(confirm("¿Seguro que quieres vaciar tu carrito?")) {
                localStorage.removeItem('carritoFourteen'); 
                carrito = []; 
                renderizarCarrito(); 
            }
        });

        renderizarCarrito();
    </script>
</body>
</html>
